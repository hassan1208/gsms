name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build GeneralStore.sln -c Release

      - name: Test
        run: dotnet test GeneralStore.sln -c Release --no-build --logger "console;verbosity=normal"

      - name: Publish single-file EXE
        run: >
          dotnet publish src/GeneralStore/GeneralStore.vbproj -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: GeneralStore-win-x64
          path: publish/
